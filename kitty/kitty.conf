### FONT ###
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# IBM Plex Mono saknar Nerd Font-ikonglyfer (t.ex. starships git-branch-symbol).
# Rendera bara de tecken-intervallen från JetBrainsMono Nerd Font istället för
# att byta hela typsnittet. Kräver `ttf-ibm-plex` för själva brödtextfonten
# (installerad och verifierad 2026-09-14, se vault/04-tema/design.md).
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3EB,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

### FÖNSTER ###
# Marginal runt texten i fönstret
window_padding_width 10

# Genomskinlighet - kombineras med Hyprlands blur (Glassy-estetik, decoration.blur i hyprland.lua)
# 1.0 = helt solid, 0.0 = helt genomskinlig
background_opacity 0.75
dynamic_background_opacity yes

# Fråga inte om bekräftelse när fönstret stängs med olevererade processer
confirm_os_window_close 0

# Storlek i antal kolumner/rader när ett nytt fönster öppnas
initial_window_width  120c
initial_window_height 32c

### FLIKAR (tabbar) ###
# Öppna en ny flik: ctrl+shift+t | stäng: ctrl+shift+q | byt: ctrl+shift+right/left
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

### RUTOR (splits) ###
# ctrl+shift+enter delar fönstret, ctrl+shift+w stänger rutan
enabled_layouts splits, stack, tall

### SCROLLBACK ###
scrollback_lines 10000
# Sök i scrollback: ctrl+shift+h (kräver att kitty-search kernel finns, annars ctrl+shift+f)
wheel_scroll_min_lines 1

### MARKÖR ###
cursor_shape beam
cursor_blink_interval 0.5

### KLICKBETEENDE ###
# Dubbelklick markerar ord, trippelklick markerar rad
copy_on_select yes
strip_trailing_spaces smart

### LJUD ###
# GNOME:s "plopp"-felljud (bell.oga), konverterad till wav och inkopplad här
enable_audio_bell yes
bell_path ~/.config/kitty/sounds/bell.wav
visual_bell_duration 0.0

### GENVÄGAR (utöver kittys inbyggda standardgenvägar) ###
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Ctrl+C kopierar om text är markerad, annars vanligt SIGINT (avbryt) som förut.
# Ctrl+V klistrar in rakt av - du tappar readlines "literal next"-funktion (sällan använd).
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+f5 load_config_file

### FÄRGTEMA — dynamiskt per bakgrund (se vault/04-tema/dynamiskt-tema.md) ###
# Färgerna själva ligger i colors.conf (genereras om av wallust vid
# bakgrundsbyte, eller kopieras från wallust/anchor/ för ankarbilden) -
# ctrl+shift+f5 laddar om utan att starta om kitty.
include colors.conf
