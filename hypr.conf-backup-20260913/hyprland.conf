source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    animation = windows, 1, 4, easeOutCubic, popin 80%
    animation = windowsOut, 1, 4, easeOutCubic, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, easeOutCubic
    animation = workspaces, 1, 4, easeInOutCubic, slide
    animation = specialWorkspace, 1, 4, easeOutCubic, slidevert
}

misc {
    vrr = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
}