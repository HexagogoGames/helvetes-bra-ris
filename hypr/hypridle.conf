general {
    lock_cmd = pidof hyprlock || hyprlock
    # Armar en markörfil innan varje vila - konsumeras av power-button.sh
    # om strömknappen genererar ett väck-eko direkt efter uppvaknande. Se
    # vault/03-felsokning/strömknapp-ekar-efter-vila.md.
    before_sleep_cmd = sh -c 'loginctl lock-session; touch ~/.cache/power-button-wake-pending'
    # Städar bort markören 5 sek efter uppvaknande om inget eko konsumerade
    # den (t.ex. väckt med tangentbord/mus istället för strömknappen).
    after_sleep_cmd = sh -c 'hyprctl dispatch dpms on; (sleep 5; rm -f ~/.cache/power-button-wake-pending) & disown'
}

# Dim skärmen efter 5 min inaktivitet
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lås efter 10 min
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Stäng av skärmen efter 15 min
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Sov efter 20 min för att spara batteri
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
