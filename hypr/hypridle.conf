general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Tidsstämpel så power-button.sh kan skilja på strömknappens
    # väck-eko och ett nytt, avsiktligt tryck - se
    # vault/03-felsokning/strömknapp-ekar-efter-vila.md.
    after_sleep_cmd = sh -c 'hyprctl dispatch dpms on; date +%s > ~/.cache/last-resume-time'
}

# Dim skärmen efter 5 min inaktivitet
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lås efter 10 min
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Stäng av skärmen efter 15 min
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Sov efter 20 min för att spara batteri
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
