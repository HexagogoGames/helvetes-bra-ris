# hyprpaper — ersätter swaybg (temaomdesign 2026-09-14, se vault/04-tema/design.md)
#
# OBS: installerad hyprpaper-version (0.8.4, byggd mot hyprtoolkit) använder ett
# nyare config-schema än det klassiska preload=/wallpaper=. Se
# vault/03-felsokning/ för detaljer kring hur detta hittades.
#
# path pekar på en mapp (inte en enskild fil) -> hyprpaper loopar automatiskt
# igenom alla bilder däri (källkodsbekräftat: CImagesData/onRepeatTimer i
# src/ui/UI.cpp), byter var 20:e minut, i filnamnsordning.
splash = 0
ipc = 1

wallpaper {
    monitor = eDP-1
    path = /home/jakob/dotfiles/images/backgrounds
    fit_mode = cover
    timeout = 1200
    order = default
}
