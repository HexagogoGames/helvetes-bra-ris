# hyprpaper — ersätter swaybg (temaomdesign 2026-09-14, se vault/04-tema/design.md)
# Bildkälla: ~/dotfiles/images/backgrounds/forrest background1.avif (Jakobs eget val)
# Konverterad till PNG — hyprpaper länkar bara mot libpng/libjpeg/libwebp, inget libavif.
#
# OBS: installerad hyprpaper-version (0.8.4, byggd mot hyprtoolkit) använder ett
# nyare config-schema än det klassiska preload=/wallpaper=. Se
# vault/03-felsokning/ för detaljer kring hur detta hittades.
splash = 0
ipc = 1

wallpaper {
    monitor = eDP-1
    path = /home/jakob/dotfiles/images/backgrounds/forrest-background1.png
    fit_mode = cover
}
